<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage" style="padding:24px;display:flex;align-items:center;gap:32px;justify-content:center">
    <div style="width:96px;height:96px;background:#0a0a0f;border-radius:18px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-soft)">
      <img src="../assets/favicon.svg" width="64" height="64" alt="favicon">
    </div>
    <div style="width:64px;height:64px;background:#0a0a0f;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-soft)">
      <img src="../assets/favicon.svg" width="40" height="40" alt="favicon sm">
    </div>
    <div style="width:32px;height:32px;background:#0a0a0f;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-soft)">
      <img src="../assets/favicon.svg" width="20" height="20" alt="favicon xs">
    </div>
    <div style="flex:1;font-size:11px;color:var(--text-muted);line-height:1.6">
      <div class="token-row__name" style="color:var(--text-primary)">assets/favicon.svg</div>
      Rounded square (rx=12), bg #0a0a0f, holds the teardrop pin glyph.<br>
      Used for browser tab, apple-touch, manifest icon.
    </div>
  </div>
</body></html>
