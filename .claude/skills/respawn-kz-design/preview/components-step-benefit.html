<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:16px">
      <div class="step">
        <div class="step__num">01</div>
        <div class="step__icon">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64">
            <path d="M32 8 C22 8 14 16 14 26 C14 38 32 56 32 56 C32 56 50 38 50 26 C50 16 42 8 32 8 Z"/>
            <circle cx="32" cy="26" r="6"/>
          </svg>
        </div>
        <h3 class="step__title">Выбери клуб</h3>
        <p class="step__desc">Фильтруй по району, цене и оборудованию.</p>
      </div>
      <div class="benefit">
        <div class="benefit__icon">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="22" height="20" rx="3"/>
            <path d="M3 11 H25"/>
            <path d="M9 2 V8 M19 2 V8"/>
            <path d="M9 17 L13 21 L21 13"/>
          </svg>
        </div>
        <div>
          <h3 class="benefit__title">Онлайн-бронирование</h3>
          <p class="benefit__desc">Не нужно звонить и держать место. Бронь подтверждается мгновенно.</p>
        </div>
      </div>
    </div>
  </div>
</body></html>
