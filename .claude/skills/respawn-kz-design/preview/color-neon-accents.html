<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;background:#14141c;border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px;text-align:center">
      <div style="width:100%;height:54px;background:#00f0ff;border-radius:var(--radius-sm);box-shadow:0 0 24px rgba(0,240,255,.4)"></div>
      <div class="token-row__name" style="margin-top:10px">--neon-cyan</div>
      <div class="token-row__hex" style="text-align:center">#00f0ff</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.4">CTAs · links · focus · "success"</div>
    </div>
    <div style="flex:1;background:#14141c;border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px;text-align:center">
      <div style="width:100%;height:54px;background:#ff2e9a;border-radius:var(--radius-sm);box-shadow:0 0 24px rgba(255,46,154,.4)"></div>
      <div class="token-row__name" style="margin-top:10px">--neon-magenta</div>
      <div class="token-row__hex" style="text-align:center">#ff2e9a</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.4">errors · cancelled · glitch</div>
    </div>
    <div style="flex:1;background:#14141c;border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px;text-align:center">
      <div style="width:100%;height:54px;background:#fef300;border-radius:var(--radius-sm);box-shadow:0 0 24px rgba(254,243,0,.35)"></div>
      <div class="token-row__name" style="margin-top:10px">--neon-yellow</div>
      <div class="token-row__hex" style="text-align:center">#fef300</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.4">ratings · pending · warning</div>
    </div>
  </div>
</body></html>
