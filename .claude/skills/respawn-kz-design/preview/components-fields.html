<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
      <label class="field">
        <span class="field__label">Город</span>
        <select class="field__input"><option>Алматы</option></select>
      </label>
      <label class="field">
        <span class="field__label">Дата</span>
        <input class="field__input" type="text" value="16.05.2026" readonly>
      </label>
      <label class="field">
        <span class="field__label">Время</span>
        <select class="field__input"><option>20:00</option></select>
      </label>
    </div>
    <div style="margin-top:14px">
      <label class="field">
        <span class="field__label">Email</span>
        <input class="field__input" type="email" value="you@example.com">
      </label>
    </div>
  </div>
</body></html>
