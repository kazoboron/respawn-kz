<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="eyebrow" style="margin-bottom:12px">Spacing rhythm — 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 48 / 64 / 96</div>
  <div style="display:flex;align-items:flex-end;gap:8px">
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:4px;background:var(--neon-cyan);opacity:.35;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">4</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:8px;background:var(--neon-cyan);opacity:.4;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">8</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:12px;background:var(--neon-cyan);opacity:.45;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">12</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:16px;background:var(--neon-cyan);opacity:.5;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">16</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:20px;background:var(--neon-cyan);opacity:.55;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">20</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:24px;background:var(--neon-cyan);opacity:.6;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">24</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:32px;background:var(--neon-cyan);opacity:.7;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">32</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:40px;background:var(--neon-cyan);opacity:.8;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">40</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:48px;background:var(--neon-cyan);opacity:.9;border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">48</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:64px;background:var(--neon-cyan);border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">64</div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="width:100%;height:96px;background:var(--neon-cyan);border-radius:2px"></div>
      <div class="token-row__hex" style="text-align:center;margin-top:6px">96</div>
    </div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:var(--text-muted);line-height:1.6">
    Container: max-w 1200, padding-x 20 (16 mobile). Section padding-y 96 → 72 (≤1024) → 56 (≤768).
  </div>
</body></html>
