<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="row" style="gap:18px">
    <div style="text-align:center">
      <div class="swatch swatch--lg" style="background:#0a0a0f;border:1px solid var(--border-soft)"></div>
      <div class="token-row__name" style="margin-top:8px">--bg-base</div>
      <div class="token-row__hex" style="text-align:center">#0a0a0f</div>
    </div>
    <div style="text-align:center">
      <div class="swatch swatch--lg" style="background:#14141c;border:1px solid var(--border-soft)"></div>
      <div class="token-row__name" style="margin-top:8px">--bg-surface</div>
      <div class="token-row__hex" style="text-align:center">#14141c</div>
    </div>
    <div style="text-align:center">
      <div class="swatch swatch--lg" style="background:#1c1c28;border:1px solid var(--border-soft)"></div>
      <div class="token-row__name" style="margin-top:8px">--bg-elevated</div>
      <div class="token-row__hex" style="text-align:center">#1c1c28</div>
    </div>
    <div style="flex:1;padding-left:8px;border-left:1px solid var(--border-soft);align-self:stretch">
      <div class="eyebrow" style="margin-bottom:8px">Stacked depth</div>
      <div style="background:#0a0a0f;padding:10px;border-radius:8px">
        <div style="background:#14141c;padding:10px;border-radius:6px;border:1px solid var(--border-soft)">
          <div style="background:#1c1c28;padding:8px 12px;border-radius:6px;font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)">input field</div>
        </div>
      </div>
      <div class="token-row__hex" style="margin-top:8px;text-align:left;font-size:11px">base → surface → elevated. Never #000.</div>
    </div>
  </div>
</body></html>
