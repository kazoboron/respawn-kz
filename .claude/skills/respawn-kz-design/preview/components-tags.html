<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage">
    <div class="eyebrow" style="margin-bottom:8px">.tag — feature tags (cyan)</div>
    <div class="wrap">
      <span class="tag">PC</span><span class="tag">PS5</span><span class="tag">VR</span><span class="tag">Sim Racing</span>
    </div>

    <div class="eyebrow" style="margin:18px 0 8px">.chip — filter chips (toggleable)</div>
    <div class="wrap">
      <span class="chip is-active">Все города</span>
      <span class="chip">Алматы</span>
      <span class="chip">Астана</span>
      <span class="chip">Шымкент</span>
      <span class="chip">Караганда</span>
    </div>

    <div class="eyebrow" style="margin:18px 0 8px">.pill — status & rating</div>
    <div class="wrap">
      <span class="pill pill--rating">★ 4.9</span>
      <span class="pill pill--pending">pending</span>
      <span class="pill pill--confirmed">confirmed</span>
      <span class="pill pill--cancelled">cancelled</span>
    </div>
  </div>
</body></html>
