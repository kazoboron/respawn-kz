<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage" style="background:radial-gradient(ellipse 80% 70% at 50% 50%,rgba(99,102,241,.06),transparent 70%),#0a0a0f">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">
      <div>
        <div style="background:#00f0ff;color:#001014;font-weight:600;font-size:14px;padding:14px 22px;border-radius:12px;text-align:center;box-shadow:0 0 24px rgba(0,240,255,.4)">Primary button</div>
        <div class="token-row__name" style="margin-top:10px">--glow-cyan</div>
        <div class="token-row__hex" style="text-align:left;font-size:10px;line-height:1.4">0 0 24px rgba(0,240,255, .4)</div>
      </div>
      <div>
        <div style="background:#14141c;border:1px solid rgba(255,46,154,.2);color:var(--neon-magenta);font-weight:600;font-size:14px;padding:14px 22px;border-radius:12px;text-align:center;box-shadow:0 0 24px rgba(255,46,154,.35)">Magenta surface</div>
        <div class="token-row__name" style="margin-top:10px">--glow-magenta</div>
        <div class="token-row__hex" style="text-align:left;font-size:10px;line-height:1.4">0 0 24px rgba(255,46,154, .4)</div>
      </div>
      <div>
        <div style="background:#14141c;border:1px solid rgba(0,240,255,.4);font-size:13px;padding:14px 22px;border-radius:20px;text-align:center;color:var(--text-primary);box-shadow:0 12px 40px rgba(0,240,255,.15), 0 0 24px rgba(0,240,255,.1)">Card · hover state</div>
        <div class="token-row__name" style="margin-top:10px">--glow-card</div>
        <div class="token-row__hex" style="text-align:left;font-size:10px;line-height:1.4">0 12px 40px cyan/.15 + 0 0 24px cyan/.1</div>
      </div>
      <div>
        <div style="background:#14141c;border:1px solid rgba(0,240,255,.15);font-size:13px;padding:14px 22px;border-radius:20px;text-align:center;color:var(--text-primary);box-shadow:0 8px 32px rgba(0,0,0,.5)">Search bar</div>
        <div class="token-row__name" style="margin-top:10px">--shadow-deep</div>
        <div class="token-row__hex" style="text-align:left;font-size:10px;line-height:1.4">0 8px 32px rgba(0,0,0, .5)</div>
      </div>
    </div>
  </div>
</body></html>
