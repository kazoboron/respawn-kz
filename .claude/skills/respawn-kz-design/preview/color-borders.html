<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;background:#14141c;border:1px solid rgba(0,240,255,.15);border-radius:var(--radius-md);padding:18px">
      <div class="token-row__name">--border</div>
      <div class="token-row__hex" style="text-align:left;margin-top:4px;line-height:1.5">rgba(0,240,255, .15)<br><span style="color:var(--text-secondary)">cyan tint · default</span></div>
    </div>
    <div style="flex:1;background:#14141c;border:1px solid rgba(0,240,255,.4);border-radius:var(--radius-md);padding:18px;box-shadow:0 0 20px rgba(0,240,255,.08)">
      <div class="token-row__name">--border-hover</div>
      <div class="token-row__hex" style="text-align:left;margin-top:4px;line-height:1.5">rgba(0,240,255, .40)<br><span style="color:var(--text-secondary)">on hover</span></div>
    </div>
    <div style="flex:1;background:#14141c;border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-md);padding:18px">
      <div class="token-row__name">--border-soft</div>
      <div class="token-row__hex" style="text-align:left;margin-top:4px;line-height:1.5">rgba(255,255,255, .06)<br><span style="color:var(--text-secondary)">card hairline</span></div>
    </div>
  </div>
</body></html>
