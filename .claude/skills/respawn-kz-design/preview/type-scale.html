<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div style="display:grid;grid-template-columns:80px 1fr 70px;gap:14px;align-items:baseline">
    <div class="token-row__name">--fs-hero</div>
    <div style="font-family:var(--font-sans);font-weight:700;font-size:48px;letter-spacing:-0.02em;line-height:1.1">Hero — Игра ждёт</div>
    <div class="token-row__hex">36–64</div>

    <div class="token-row__name">--fs-section</div>
    <div style="font-family:var(--font-sans);font-weight:700;font-size:32px;letter-spacing:-0.02em;line-height:1.2">Топ клубы</div>
    <div class="token-row__hex">28–40</div>

    <div class="token-row__name">--fs-h3</div>
    <div style="font-family:var(--font-sans);font-weight:700;font-size:22px;letter-spacing:-0.02em;line-height:1.2">Карточка</div>
    <div class="token-row__hex">22</div>

    <div class="token-row__name">--fs-body</div>
    <div style="font-family:var(--font-sans);font-size:16px;line-height:1.6;color:var(--text-secondary)">Body — Выбирай слот, оплачивай онлайн.</div>
    <div class="token-row__hex">16</div>

    <div class="token-row__name">--fs-meta</div>
    <div style="font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--text-secondary)">Meta — Алматы · Алмалинский р-н</div>
    <div class="token-row__hex">14</div>

    <div class="token-row__name">--fs-eyebrow</div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:500">EYEBROW — ГОРОД</div>
    <div class="token-row__hex">11</div>
  </div>
</body></html>
