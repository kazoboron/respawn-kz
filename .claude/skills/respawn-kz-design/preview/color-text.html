<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div style="background:#0a0a0f;padding:18px;border-radius:var(--radius-md);border:1px solid var(--border-soft)">
    <div style="display:grid;grid-template-columns:1fr 130px 90px;gap:14px;align-items:center">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:22px;color:#f0f0ff;letter-spacing:-0.02em">Headline / primary text</div>
      <div class="token-row__name">--text-primary</div>
      <div class="token-row__hex">#f0f0ff</div>

      <div style="font-family:var(--font-sans);font-size:16px;color:#a0a0b8;line-height:1.5">Body & subtitles — секондари</div>
      <div class="token-row__name">--text-secondary</div>
      <div class="token-row__hex">#a0a0b8</div>

      <div style="font-family:var(--font-sans);font-size:13px;color:#60607a">Helper · label · ©copy</div>
      <div class="token-row__name">--text-muted</div>
      <div class="token-row__hex">#60607a</div>
    </div>
  </div>
</body></html>
