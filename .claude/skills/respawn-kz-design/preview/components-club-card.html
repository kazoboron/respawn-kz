<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage" style="padding:24px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <article class="club-card">
        <div class="club-card__media" style="background:linear-gradient(135deg,#00f0ff,#0066ff)">
          <span class="club-card__initial">C</span>
        </div>
        <div class="club-card__body">
          <div class="club-card__header">
            <h3 class="club-card__name">Cyberzone</h3>
            <span class="pill pill--rating">★ 4.9</span>
          </div>
          <div class="club-card__meta">
            <span>Алматы</span><span class="club-card__meta-sep">·</span><span>Алмалинский р-н</span>
          </div>
          <div class="club-card__tags">
            <span class="tag">PC</span><span class="tag">PS5</span><span class="tag">VR</span>
          </div>
          <div class="club-card__footer">
            <div class="club-card__price">
              <span class="club-card__price-from">от</span><span class="club-card__price-value">1 200 ₸</span><span class="club-card__price-unit"> /час</span>
            </div>
            <button class="btn btn--primary btn--sm">Забронировать</button>
          </div>
        </div>
      </article>
      <article class="club-card" style="border-color:rgba(0,240,255,.4);box-shadow:0 12px 40px rgba(0,240,255,.15), 0 0 24px rgba(0,240,255,.1)">
        <div class="club-card__media" style="background:linear-gradient(135deg,#ff2e9a,#8b00ff)">
          <span class="club-card__initial">C</span>
        </div>
        <div class="club-card__body">
          <div class="club-card__header">
            <h3 class="club-card__name">Colizeum</h3>
            <span class="pill pill--rating">★ 4.8</span>
          </div>
          <div class="club-card__meta">
            <span>Астана</span><span class="club-card__meta-sep">·</span><span>Есильский р-н</span>
          </div>
          <div class="club-card__tags">
            <span class="tag">PC</span><span class="tag">Sim Racing</span>
          </div>
          <div class="club-card__footer">
            <div class="club-card__price">
              <span class="club-card__price-from">от</span><span class="club-card__price-value">1 500 ₸</span><span class="club-card__price-unit"> /час</span>
            </div>
            <button class="btn btn--primary btn--sm">Забронировать</button>
          </div>
        </div>
      </article>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5">Left: default · Right: hover state (border-hover + glow-card)</div>
  </div>
</body></html>
