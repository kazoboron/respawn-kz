<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div style="position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-lg);height:280px;background:
      radial-gradient(ellipse 80% 50% at 20% 30%, rgba(99,102,241,.18), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 70%, rgba(168,85,247,.14), transparent 60%),
      #0a0a0f;
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border:1px solid var(--border-soft)">
    <div aria-hidden="true" style="position:absolute;inset:0;background-image:url(../assets/club-hero.webp);background-size:cover;background-position:center;opacity:.22;z-index:-1;mask-image:radial-gradient(ellipse 110% 90% at 50% 40%, black 20%, transparent 95%);-webkit-mask-image:radial-gradient(ellipse 110% 90% at 50% 40%, black 20%, transparent 95%)"></div>
    <div aria-hidden="true" style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);pointer-events:none"></div>
    <div style="position:relative;z-index:2;text-align:center">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em">Hero background layering</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.6;max-width:480px">
        base · 2× radial gradient halos · photo @ opacity .22 with radial mask · 60×60 grid w/ vignette mask
      </div>
    </div>
  </div>
</body></html>
