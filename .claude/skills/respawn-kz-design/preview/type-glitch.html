<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.glitch{position:relative;color:var(--neon-cyan);display:inline-block;font-family:var(--font-sans);font-weight:700;font-size:48px;letter-spacing:-0.02em}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--neon-magenta);transform:translate(-2px,0);mix-blend-mode:screen;clip-path:polygon(0 0,100% 0,100% 45%,0 45%);opacity:.8}
.glitch::after{color:var(--neon-yellow);transform:translate(2px,0);mix-blend-mode:screen;clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%);opacity:.7}
@keyframes gl1{0%{transform:translate(-2px,0)}20%{transform:translate(-6px,1px)}40%{transform:translate(0,-1px)}60%{transform:translate(-4px,0)}80%{transform:translate(-1px,1px)}100%{transform:translate(-2px,0)}}
@keyframes gl2{0%{transform:translate(2px,0)}20%{transform:translate(5px,-1px)}40%{transform:translate(1px,1px)}60%{transform:translate(3px,0)}80%{transform:translate(0,-1px)}100%{transform:translate(2px,0)}}
.glitch.go::before{animation:gl1 .6s steps(2) infinite}
.glitch.go::after{animation:gl2 .6s steps(2) infinite}
</style>
</head>
<body style="width:700px">
  <div class="eyebrow" style="margin-bottom:14px">.glitch — accent on hero hot-word</div>
  <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
    <div style="font-family:var(--font-sans);font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-0.02em">
      Забронируй за <span class="glitch go" data-text="30 секунд">30 секунд</span>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.6">
      Cyan base · Magenta clip top 45% (translate -2px) · Yellow clip bottom 55% (translate +2px)<br>
      `.is-glitching` runs <code style="color:var(--neon-cyan)">@keyframes glitch-1 / glitch-2</code> for 600ms; fired randomly every few seconds.
    </div>
  </div>
</body></html>
