<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="eyebrow" style="margin-bottom:12px">Synthetic gradients — club card media + logo</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#00f0ff,#0066ff);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">C</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">cyan → blue</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#8b00ff,#ff2e9a);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">G</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">purple → pink</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#ff2e9a,#fef300);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">E</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">pink → yellow</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#fef300,#ff6a00);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">R</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">yellow → orange</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#00f0ff,#ff2e9a);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">N</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">cyan → pink</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#0066ff,#00f0ff);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">L</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">blue → cyan</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#00f0ff,#fef300);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">P</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">cyan → yellow</div>
    </div>
    <div>
      <div style="aspect-ratio:1.4;background:linear-gradient(135deg,#ff2e9a,#00f0ff);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:42px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)">I</div>
      <div class="token-row__hex" style="margin-top:6px;text-align:left;font-size:10px">pink → cyan</div>
    </div>
  </div>
  <div style="margin-top:10px;font-size:11px;color:var(--text-muted);line-height:1.5">All 135°, two-stop. Mono initial centered on top, opacity 0.85 + 4px dark shadow. Used for `.club-card__media`.</div>
</body></html>
