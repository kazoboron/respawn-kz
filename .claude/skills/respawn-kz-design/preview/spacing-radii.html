<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;text-align:center">
      <div style="background:#14141c;border:1px solid var(--border-soft);width:100%;height:80px;border-radius:6px"></div>
      <div class="token-row__name" style="margin-top:10px">--radius-sm</div>
      <div class="token-row__hex" style="text-align:center">6 px</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">chips · tags · pills</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="background:#14141c;border:1px solid var(--border-soft);width:100%;height:80px;border-radius:12px"></div>
      <div class="token-row__name" style="margin-top:10px">--radius-md</div>
      <div class="token-row__hex" style="text-align:center">12 px</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">inputs · buttons</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="background:#14141c;border:1px solid var(--border-soft);width:100%;height:80px;border-radius:20px"></div>
      <div class="token-row__name" style="margin-top:10px">--radius-lg</div>
      <div class="token-row__hex" style="text-align:center">20 px</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">cards · modals · sections</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="background:#14141c;border:1px solid var(--border-soft);width:100%;height:80px;border-radius:100px"></div>
      <div class="token-row__name" style="margin-top:10px">--radius-pill</div>
      <div class="token-row__hex" style="text-align:center">100 px</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">status · rating</div>
    </div>
  </div>
</body></html>
