<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="width:700px">
  <div class="demo-stage">
    <div class="row" style="gap:14px;flex-wrap:wrap;align-items:center">
      <button class="btn btn--primary">Найти клуб</button>
      <button class="btn btn--primary btn--large">Забронировать</button>
      <button class="btn btn--ghost">Войти</button>
      <button class="btn btn--primary btn--sm">Забронировать</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px">
      <div class="token-row__name">.btn--primary</div>
      <div class="token-row__name">.btn--primary.large</div>
      <div class="token-row__name">.btn--ghost</div>
      <div class="token-row__name">.btn--primary.sm</div>
    </div>
  </div>
  <div style="margin-top:12px;font-size:11px;color:var(--text-muted);line-height:1.6">
    Primary sits on a permanent cyan halo · hover widens halo + lifts –2px. Ghost is transparent w/ 15%-alpha cyan border → 40% on hover.
  </div>
</body></html>
